spring.application.name=university-event-management

# Database - Defaults to H2 (In-Memory) for local development
# Render will override these with DB_HOST, DB_NAME, DB_USER, DB_PASSWORD environment variables
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:university_ems}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# H2 Fallback Profile (Active by default locally if no DB_HOST is provided)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gc2lnbmluZw==
jwt.expiration=86400000

# Server
server.port=${PORT:8080}

# CORS - allows localhost for local dev + all Render-hosted frontends
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3001,https://*.onrender.com}
