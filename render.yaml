# Render.com Deployment Configuration
# University Event Management System (Render-Only Architecture)

services:
  # Spring Boot Backend
  - type: web
    name: ems-backend
    region: oregon
    plan: free
    env: docker
    dockerContext: backend-springboot
    dockerfilePath: backend-springboot/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: ems-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ems-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ems-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: ems-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ems-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: FRONTEND_URL
        sync: false

  # React Frontend
  - type: web
    name: ems-web-frontend
    runtime: static
    buildCommand: cd frontend-react && npm ci && npm run build
    staticPublishPath: frontend-react/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: ems-postgres
    databaseName: university_ems
    user: ems_user
    plan: free
    region: oregon