# Render.com Deployment Configuration
# University Event Management System

services:
  # Spring Boot Backend
  - type: web
    name: ems-backend
    region: oregon
    plan: free
    env: docker
    dockerContext: backend-springboot
    dockerfilePath: backend-springboot/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ems-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: FRONTEND_URL
        value: https://ems-frontend-zkqq.onrender.com

  # React Frontend (Docker Service)
  - type: web
    name: ems-frontend
    region: oregon
    plan: free
    env: docker
    dockerContext: frontend-react
    dockerfilePath: frontend-react/Dockerfile
    envVars:
      - key: VITE_API_URL
        value: https://ems-backend-jisu.onrender.com

  # React Frontend (Static Site)
  - type: web
    name: ems-web-frontend
    runtime: static
    buildCommand: cd frontend-react && npm ci && npm run build
    staticPublishPath: frontend-react/dist
    envVars:
      - key: VITE_API_URL
        value: https://ems-backend-jisu.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: ems-postgres
    databaseName: university_ems
    user: ems_user
    plan: free
    region: oregon